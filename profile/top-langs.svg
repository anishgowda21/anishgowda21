<svg xmlns="http://www.w3.org/2000/svg" width="440" height="216"
     viewBox="0 0 440 216" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    
<clipPath id="bar">
  <rect x="24" y="56" width="392" height="10" rx="5.0"/>
</clipPath>

  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: url(#tg); }
    .name { font-size: 13px; fill: #c0caf5; }
    .pct { font-size: 13px; fill: #565f89; }
    
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    .fade { animation: fade .5s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .grow, .fade { animation: none; } }
    
    
  </style>
  <rect x=".5" y=".5" width="439" height="215" rx="10" fill="#1a1b26" stroke="#2f334d"/>
  <text class="title" x="24" y="38">Most Used Languages</text>
  
<g clip-path="url(#bar)">
  <g class="grow">
    
    <rect x="24.0" y="56" width="215.66" height="10" fill="#f1e05a" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="239.66" y="56" width="35.98" height="10" fill="#3178c6" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="275.64" y="56" width="27.4" height="10" fill="#DA5B0B" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="303.04" y="56" width="20.8" height="10" fill="#555555" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="323.84" y="56" width="19.66" height="10" fill="#00ADD8" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="343.5" y="56" width="17.61" height="10" fill="#00B4AB" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="361.11" y="56" width="54.89" height="10" fill="#8b949e" stroke="#1a1b26" stroke-width="1.5"/>
    
  </g>
</g>

<g class="fade" style="animation-delay: 300ms">
  <circle cx="29.0" cy="92" r="5" fill="#f1e05a"/>
  <text class="name" x="42.0" y="96">JavaScript</text>
  <text class="pct" x="204.0" y="96" text-anchor="end">55.0%</text>
</g>

<g class="fade" style="animation-delay: 360ms">
  <circle cx="225.0" cy="92" r="5" fill="#3178c6"/>
  <text class="name" x="238.0" y="96">TypeScript</text>
  <text class="pct" x="400.0" y="96" text-anchor="end">9.2%</text>
</g>

<g class="fade" style="animation-delay: 420ms">
  <circle cx="29.0" cy="118" r="5" fill="#DA5B0B"/>
  <text class="name" x="42.0" y="122">Jupyter Notebook</text>
  <text class="pct" x="204.0" y="122" text-anchor="end">7.0%</text>
</g>

<g class="fade" style="animation-delay: 480ms">
  <circle cx="225.0" cy="118" r="5" fill="#555555"/>
  <text class="name" x="238.0" y="122">C</text>
  <text class="pct" x="400.0" y="122" text-anchor="end">5.3%</text>
</g>

<g class="fade" style="animation-delay: 540ms">
  <circle cx="29.0" cy="144" r="5" fill="#00ADD8"/>
  <text class="name" x="42.0" y="148">Go</text>
  <text class="pct" x="204.0" y="148" text-anchor="end">5.0%</text>
</g>

<g class="fade" style="animation-delay: 600ms">
  <circle cx="225.0" cy="144" r="5" fill="#00B4AB"/>
  <text class="name" x="238.0" y="148">Dart</text>
  <text class="pct" x="400.0" y="148" text-anchor="end">4.5%</text>
</g>

<g class="fade" style="animation-delay: 660ms">
  <circle cx="29.0" cy="170" r="5" fill="#8b949e"/>
  <text class="name" x="42.0" y="174">Other</text>
  <text class="pct" x="204.0" y="174" text-anchor="end">14.0%</text>
</g>


</svg>